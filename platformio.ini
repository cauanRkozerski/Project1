; PlatformIO Project Configuration File - Roteiro 7
;
; Configuração para NodeMCU ESP8266 com upload serial e OTA,
; e bibliotecas para o sensor DHT11.

[platformio]
default_envs = nodemcuv2

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 9600
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; Ambiente para gravação via cabo USB (esptool)
[env:nodemcuv2]
upload_protocol = esptool

; Ambiente para gravação via rede Wi-Fi (ArduinoOTA)
[env:ota]
upload_protocol = espota
upload_port = 172.20.10.5
upload_flags =
    --auth=admin
    --host_ip=172.20.10.3
